name: Idea
description: A feature or change you'd like to see.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The problem or use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How you'd like it to work
      description: A sketch of the prompt file or the C# you'd want to write is very welcome.
  - type: textarea
    id: today
    attributes:
      label: What you do today instead
